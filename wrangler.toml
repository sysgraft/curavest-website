name = "curavest-website"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

# Static site output — see astro.config.mjs. Served directly by the ASSETS
# binding for every request the Worker handles (see worker/index.ts).
[assets]
directory = "./dist"
binding = "ASSETS"
# Without this, an unmatched path (any typo'd or broken link) gets an empty
# body with a bare 404 status instead of the built, styled dist/404.html —
# the ASSETS binding's default (not_found_handling = "none") does not serve
# it automatically. "404-page" makes it look for the nearest 404.html up the
# path, which for this single-level site is always the one at the root.
not_found_handling = "404-page"

# No runtime environment variables or secrets are needed here — the Worker
# is a pure static-asset server. The contact form's backend is a Supabase
# Edge Function (supabase/functions/curavest-contact-form/), configured
# separately in the Supabase dashboard. See README.md "Contact form setup".
